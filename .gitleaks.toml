# Gitleaks configuration for carbonio-admin-console-ui
# This file contains allowlist entries for known false positives.
#
# How to add new entries:
#   - For patterns: add a regex to the `regexes` list (e.g. phc_* PostHog keys).
#   - For one-off commits: add the commit SHA to the `commits` list with a comment.

title = "carbonio-admin-console-ui gitleaks config"

[extend]
# Extend the default gitleaks rules
useDefault = true

[[allowlists]]
description = "False positives: PostHog public project API key and test fixture passwords"
# PostHog project API keys (phc_*) are public frontend keys intentionally bundled into
# browser JS. They are not secrets — analogous to Google Analytics tracking IDs.
regexes = ['''phc_[A-Za-z0-9]{40,}''']
