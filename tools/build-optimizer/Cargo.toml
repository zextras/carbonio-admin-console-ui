[package]
name = "build-optimizer"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
nix = "0.29"

# For Node.js FFI
neon = { version = "1.0", optional = true }

[features]
default = []
ffi = ["neon"]
