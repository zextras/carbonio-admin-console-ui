sonar.projectKey=carbonio-admin-console-ui
sonar.projectName=Admin UI Monorepo
sonar.projectVersion=1.0
sonar.sources=apps/admin-ui-bootstrapper/src,apps/admin-ui-console/src
sonar.tests=apps/admin-ui-bootstrapper/tests,apps/admin-ui-console/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Language-specific settings
sonar.javascript.lcov.reportPaths=apps/admin-ui-bootstrapper/coverage/lcov.info,apps/admin-ui-console/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/admin-ui-bootstrapper/coverage/lcov.info,apps/admin-ui-console/coverage/lcov.info

# Module separation (optional)
# sonar.modules=app1,app2
# app1.sonar.projectName=App1
# app1.sonar.sources=app1/src
# app1.sonar.tests=app1/tests
# app2.sonar.projectName=App2  
# app2.sonar.sources=app2/src
# app2.sonar.tests=app2/tests
